name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: SPM tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Release is the blocking gate: recent Swift toolchains (observed on
      # Xcode 26.2 local and 26.5 runners) carry a -Onone defect that aborts
      # a task cancelled while suspended in a sleep called through a stored
      # async closure — the determinism-injection pattern the connection
      # tests rely on. The defect is environmental (reproduced with zero
      # project code); release compiles the thunks away and runs the same
      # assertions. Debug stays as a non-blocking sentinel so a fixed
      # toolchain is noticed.
      - name: NostrCore tests (release)
        run: swift test -c release --package-path Packages/NostrCore
      - name: BuzzKit tests (release)
        run: swift test -c release --package-path Packages/BuzzKit
      - name: NostrCore tests (debug, non-blocking toolchain sentinel)
        continue-on-error: true
        run: swift test --package-path Packages/NostrCore

  lint:
    name: SwiftLint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: which swiftlint || brew install swiftlint
      - name: Lint
        run: swiftlint

  app:
    name: App tests (iOS Simulator)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Install XcodeGen
        run: which xcodegen || brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      # Test, not just build: HiveTests runs the view-model suites in the app
      # as test host (spec step-1 scope). A concrete simulator is required —
      # the generic destination can only build. The newest Xcode 26 selected
      # above may ship on the runner image without its iOS simulator runtime,
      # so install it when the device roster is empty, then pick whatever
      # iPhone the runtime provides rather than hardcoding a model name.
      - name: Ensure an iOS simulator exists
        run: |
          if ! xcrun simctl list devices available | grep -q "iPhone"; then
            sudo xcodebuild -runFirstLaunch
            xcodebuild -downloadPlatform iOS
          fi
          xcrun simctl list devices available
      - name: Test
        run: |
          DEVICE=$(xcrun simctl list devices available | sed -n 's/^ *\(iPhone [^(]*\)(.*/\1/p' | head -1 | xargs)
          echo "Testing on simulator: $DEVICE"
          xcodebuild test \
            -project Hive.xcodeproj \
            -scheme Hive \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

  conversation-ui:
    name: Conversation UI tests (iOS Simulator)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Install XcodeGen
        run: which xcodegen || brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Ensure an iOS simulator exists
        run: |
          if ! xcrun simctl list devices available | grep -q "iPhone"; then
            sudo xcodebuild -runFirstLaunch
            xcodebuild -downloadPlatform iOS
          fi
          xcrun simctl list devices available
      # The suite drives a real software keyboard: focusing the composer is what moves the
      # scroll view, and that is the whole defect class. A simulator with a hardware keyboard
      # attached never shows one, and every shape would fail on the "no software keyboard"
      # assertion rather than on anything about the app.
      #
      # The host default below is read by Simulator.app, which never runs on this runner. The
      # device carries its own copy, and while that says a hardware keyboard was last seen,
      # iOS shows no software keyboard at all — and the suite then passes *vacuously*, because
      # a keyboard element still exists in the hierarchy with zero height. Measured locally on
      # 2026-07-27: 32 readings, 0 failures, every focused reading with the keyboard taking
      # 0pt from the readable band. `focusComposer` now asserts on that, so these device-side
      # writes are what keep the suite from failing for an environment reason.
      #
      # Every line is best-effort: none of it may turn a real red into a green, and the
      # assertion in the suite is what actually reports the state.
      - name: Detach the hardware keyboard
        run: |
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false || true
          LINE=$(xcrun simctl list devices available | grep -m1 '^ *iPhone')
          UDID=$(echo "$LINE" | sed -n 's/.*(\([0-9A-Fa-f-]\{36\}\)).*/\1/p')
          echo "Preparing simulator: $LINE"
          if [ -n "$UDID" ]; then
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b || true
            xcrun simctl spawn "$UDID" defaults write com.apple.keyboard.preferences AutomaticMinimizationEnabled -bool false || true
            xcrun simctl spawn "$UDID" defaults write com.apple.keyboard.preferences HardwareKeyboardLastSeen -bool false || true
            xcrun simctl shutdown "$UDID" || true
          fi
      # Its own job, and deliberately not part of `app`: this is minutes of real UI driving
      # against eight conversation shapes, where that one is seconds of unit tests. Keeping
      # them apart means the fast gate stays fast and a slow shape cannot mask a unit failure.
      - name: Test
        run: |
          DEVICE=$(xcrun simctl list devices available | sed -n 's/^ *\(iPhone [^(]*\)(.*/\1/p' | head -1 | xargs)
          echo "Testing on simulator: $DEVICE"
          xcodebuild test \
            -project Hive.xcodeproj \
            -scheme ConversationUITests \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
