name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: SPM tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: NostrCore tests
        run: swift test --package-path Packages/NostrCore
      - name: BuzzKit tests
        run: swift test --package-path Packages/BuzzKit

  lint:
    name: SwiftLint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: which swiftlint || brew install swiftlint
      - name: Lint
        run: swiftlint

  app:
    name: App build (iOS Simulator)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Install XcodeGen
        run: which xcodegen || brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: >
          xcodebuild build
          -project Hive.xcodeproj
          -scheme Hive
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
