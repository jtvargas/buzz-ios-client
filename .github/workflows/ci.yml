name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly cold canary: a scheduled run restores no cache, so a cached green
  # that a cold build would not reproduce shows up within a week. Since the app
  # suite became request-only (see the `app` job's `if:`), this now covers the
  # packages and the lint — the cache it was built to watch is written and read
  # by manual runs alone.
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      no_cache:
        description: "Build cold — restore no cache (use when a result looks wrong)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Restored by every app-suite run, written only by one on main. See the app job.
  CACHE_PATHS: |
    .dd/Build
    .dd/ModuleCache.noindex
    .dd/SourcePackages

jobs:
  packages:
    # NostrCore and BuzzKit have no build dependency on each other, so they
    # run as two jobs rather than two steps.
    name: SPM tests (${{ matrix.package }})
    runs-on: macos-latest
    # Sized off BuzzKit, not NostrCore: one key covers both matrix legs, and
    # BuzzKit is the slow one (296s worst, against NostrCore's 125s). Sizing
    # this off the leg that actually hung would have been far too tight for the
    # leg that did not.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [NostrCore, BuzzKit]
    steps:
      - uses: actions/checkout@v4
      # Release is the blocking gate: recent Swift toolchains (observed on
      # Xcode 26.2 local and 26.5 runners) carry a -Onone defect that aborts
      # a task cancelled while suspended in a sleep called through a stored
      # async closure — the determinism-injection pattern the connection
      # tests rely on. The defect is environmental (reproduced with zero
      # project code); release compiles the thunks away and runs the same
      # assertions.
      - name: Tests (release)
        run: swift test -c release --package-path Packages/${{ matrix.package }}

  toolchain-sentinel:
    # Debug is not a gate — it watches for the -Onone defect above being
    # fixed. A merge to main notices that within one commit, so pull
    # requests do not pay for it.
    name: NostrCore debug sentinel (non-blocking)
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    # The job that needs this most, and looks like it needs it least.
    # `continue-on-error` below caps the blast radius of a *failure*; it does
    # nothing to a hang. So this is the one job that can hold a run open for the
    # 360-minute default while being, by design, the one nobody watches for a
    # verdict — running the same package and command family that froze twice on
    # 2026-08-04, in debug.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: NostrCore tests (debug)
        continue-on-error: true
        run: swift test --package-path Packages/NostrCore

  lint:
    name: SwiftLint
    runs-on: macos-latest
    # Ten rather than the ~30s this takes: `brew install swiftlint` on a cold
    # runner image is the unbounded part, and a slow install is not what any of
    # these ceilings are defending against.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: which swiftlint || brew install swiftlint
      - name: Lint
        run: swiftlint

  app:
    name: App tests (iOS Simulator)
    # Request-only, by the owner's decision (2026-07-31). This job is the one
    # that boots a simulator, and it has gone red on main eight times without a
    # defect under it — `SendPathTests.failedThenRetry()` and once
    # `MentionComposerTests.ranksPeopleByRecentUsage()`, always "Time limit was
    # exceeded: 60.000 seconds", always green on a re-run of the same commit.
    # Twice the identical tree passed every job on the pull request minutes
    # before failing on main. A red that is dismissed by habit is worse than no
    # red at all: it hides the day it is real.
    #
    # So the simulator suites now run the way the conversation shape gate
    # already does — on request, from the Actions tab or `gh workflow run ci.yml
    # --ref <branch>`, before anything that touches the send path, the outbox,
    # persistence, or the composer. What still runs on every pull request is the
    # part that has never flaked: both package suites (release) and SwiftLint.
    #
    # To put it back on every push, delete this `if:` and restore the save
    # step's condition below.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    # The widest margin here, against a 517s worst case, and deliberately so:
    # only two measured runs to size from, the only job that depends on a
    # restored cache, and `Ensure an iOS simulator exists` below can fall
    # through to `xcodebuild -downloadPlatform iOS`, which on a runner image
    # shipped without the runtime outruns a tighter ceiling on its own. Still
    # turns six hours into three quarters of one.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version
          echo "XCODE_BUILD=$(xcodebuild -version | tail -1 | awk '{print $NF}')" >> "$GITHUB_ENV"

      # Restoring a build directory does not skip the build — every source
      # file is still compiled or revalidated by content, so a changed file
      # is always recompiled. Measured locally: a cold build is 32s; the same
      # build over a restored directory, with every source file given a fresh
      # timestamp and Hive.xcodeproj deleted and regenerated, is 14s.
      #
      # All three directories are needed. Build alone gets 28s (SwiftPM
      # re-clones the dependencies), Build + ModuleCache 24s.
      #
      # Pull requests restore but never save: a pull request cannot poison
      # what the next one restores. The key carries the exact Xcode build so
      # a toolchain change forces a cold build on its own. To disable the
      # whole mechanism, set the restore step's `if:` to false.
      - name: Restore build cache
        if: github.event_name != 'schedule' && github.event.inputs.no_cache != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CACHE_PATHS }}
          # Package.resolved is gitignored here and dependencies are pinned
          # `exact:`, so the manifests are what a resolution depends on.
          key: hive-dd-${{ env.XCODE_BUILD }}-${{ hashFiles('Packages/*/Package.swift', 'project.yml') }}-${{ github.sha }}
          restore-keys: |
            hive-dd-${{ env.XCODE_BUILD }}-${{ hashFiles('Packages/*/Package.swift', 'project.yml') }}-
            hive-dd-${{ env.XCODE_BUILD }}-

      - name: Install XcodeGen
        run: which xcodegen || brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      # Test, not just build: HiveTests runs the view-model suites in the app
      # as test host (spec step-1 scope). A concrete simulator is required —
      # the generic destination can only build. The newest Xcode 26 selected
      # above may ship on the runner image without its iOS simulator runtime,
      # so install it when the device roster is empty, then pick whatever
      # iPhone the runtime provides rather than hardcoding a model name.
      - name: Ensure an iOS simulator exists
        run: |
          if ! xcrun simctl list devices available | grep -q "iPhone"; then
            sudo xcodebuild -runFirstLaunch
            xcodebuild -downloadPlatform iOS
          fi
          xcrun simctl list devices available
      # COMPILER_INDEX_STORE_ENABLE=NO: index data powers Xcode's editor and
      # is never read on a runner. Measured on an app build-for-testing, cold:
      # 48s emitting it, 32-37s not.
      - name: Test
        run: |
          DEVICE=$(xcrun simctl list devices available | sed -n 's/^ *\(iPhone [^(]*\)(.*/\1/p' | head -1 | xargs)
          echo "Testing on simulator: $DEVICE"
          xcodebuild test \
            -project Hive.xcodeproj \
            -scheme Hive \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -skipPackagePluginValidation \
            -derivedDataPath .dd \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO

      # Only a run on main writes a cache, and only when the tests passed. This
      # used to read `github.event_name == 'push'`; with the job request-only
      # there is no push to write one, so a manual run from main is now what
      # refreshes what the next branch restores.
      - name: Save build cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CACHE_PATHS }}
          key: hive-dd-${{ env.XCODE_BUILD }}-${{ hashFiles('Packages/*/Package.swift', 'project.yml') }}-${{ github.sha }}
