name: PR Title

# This repo squash-merges: the PR title becomes the commit subject, so it is
# linted here as Conventional Commits v1.0.0. Separate from ci.yml — reads
# only the PR title, no checkout, no build.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  lint-title:
    name: Lint PR title (Conventional Commits)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          subjectPattern: ^[a-z].*[^.]$
          subjectPatternError: |
            The subject after "type(scope): " must start with a lowercase
            letter, be imperative mood (e.g. "add", not "added"/"adds"), and
            must not end with a period.
