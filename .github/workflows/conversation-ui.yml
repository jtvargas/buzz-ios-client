# The conversation shape gate — the scroll and keyboard suite, run by hand.
#
# Deliberately not part of `ci.yml`, and so not part of any pull request. It is 10–20
# minutes of real UI driving against eight conversation shapes on a simulator, against
# seconds for every other job, and it is the one suite whose result a reviewer waits on
# without learning anything most changes could have broken. JT, 2026-07-28: run it locally
# when the work is done, and only when it is really needed.
#
# What "really needed" means: anything that touches `ConversationScaffold`, the message
# list, the composer, the keyboard or safe-area behaviour, or the fixture host those
# shapes are driven through.
#
# Locally, which is the intended path:
#
#     xcodebuild test -project Hive.xcodeproj -scheme ConversationUITests \
#       -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
#
# Here, when a clean machine is wanted instead — Actions → this workflow → Run workflow,
# picking the branch; or `gh workflow run conversation-ui.yml --ref <branch>`.
name: Conversation UI

on:
  workflow_dispatch:

jobs:
  conversation-ui:
    name: Conversation UI tests (iOS Simulator)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Install XcodeGen
        run: which xcodegen || brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Ensure an iOS simulator exists
        run: |
          if ! xcrun simctl list devices available | grep -q "iPhone"; then
            sudo xcodebuild -runFirstLaunch
            xcodebuild -downloadPlatform iOS
          fi
          xcrun simctl list devices available
      # The suite drives a real software keyboard: focusing the composer is what moves the
      # scroll view, and that is the whole defect class. A simulator with a hardware keyboard
      # attached never shows one, and every shape would fail on the "no software keyboard"
      # assertion rather than on anything about the app.
      #
      # The host default below is read by Simulator.app, which never runs on this runner. The
      # device carries its own copy, and while that says a hardware keyboard was last seen,
      # iOS shows no software keyboard at all — and the suite then passes *vacuously*, because
      # a keyboard element still exists in the hierarchy with zero height. Measured locally on
      # 2026-07-27: 32 readings, 0 failures, every focused reading with the keyboard taking
      # 0pt from the readable band. `focusComposer` now asserts on that, so these device-side
      # writes are what keep the suite from failing for an environment reason.
      #
      # Every line is best-effort: none of it may turn a real red into a green, and the
      # assertion in the suite is what actually reports the state.
      - name: Detach the hardware keyboard
        run: |
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false || true
          LINE=$(xcrun simctl list devices available | grep -m1 '^ *iPhone')
          UDID=$(echo "$LINE" | sed -n 's/.*(\([0-9A-Fa-f-]\{36\}\)).*/\1/p')
          echo "Preparing simulator: $LINE"
          if [ -n "$UDID" ]; then
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b || true
            xcrun simctl spawn "$UDID" defaults write com.apple.keyboard.preferences AutomaticMinimizationEnabled -bool false || true
            xcrun simctl spawn "$UDID" defaults write com.apple.keyboard.preferences HardwareKeyboardLastSeen -bool false || true
            xcrun simctl shutdown "$UDID" || true
          fi
      # Its own job, and deliberately not part of `app`: this is minutes of real UI driving
      # against eight conversation shapes, where that one is seconds of unit tests. Keeping
      # them apart means the fast gate stays fast and a slow shape cannot mask a unit failure.
      - name: Test
        run: |
          DEVICE=$(xcrun simctl list devices available | sed -n 's/^ *\(iPhone [^(]*\)(.*/\1/p' | head -1 | xargs)
          echo "Testing on simulator: $DEVICE"
          xcodebuild test \
            -project Hive.xcodeproj \
            -scheme ConversationUITests \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
