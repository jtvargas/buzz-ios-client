name: Bug report
description: Something broken or behaving unexpectedly
labels: [bug, needs-triage]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Sidebar
        - Conversation
        - Threads
        - DMs
        - Composer & keyboard
        - Reactions
        - Identity & pairing
        - Communities
        - Sync & connection
        - Other
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: How you installed it
      options:
        - Built from source
        - TestFlight
        - Other
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      placeholder: e.g. iPhone 15 Pro
    validations:
      required: true

  - type: input
    id: ios-version
    attributes:
      label: iOS version
      placeholder: e.g. 26.1
    validations:
      required: true

  - type: input
    id: relay
    attributes:
      label: Relay
      placeholder: e.g. relay.example.com
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Optional. Paste any relevant logs or attach screenshots.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and didn't find a duplicate
          required: true
