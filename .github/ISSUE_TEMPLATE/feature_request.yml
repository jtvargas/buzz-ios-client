name: Feature request
description: Propose a feature or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this solve? Who is it for?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: input
    id: parity
    attributes:
      label: Parity reference
      description: The matching PARITY.md row, or the upstream NIP this maps to, if any.
      placeholder: e.g. PARITY.md "Search" row, or NIP-XX
    validations:
      required: false
