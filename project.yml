name: Hive
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
packages:
  NostrCore:
    path: Packages/NostrCore
  BuzzKit:
    path: Packages/BuzzKit
  # GRDB is a direct app dependency because the view models drive SwiftUI from
  # GRDB `ValueObservation` over the store's public `reader` (spec §Observation
  # pipeline). Pinned to the exact version BuzzKit resolves, so both link one copy.
  GRDB:
    url: https://github.com/groue/GRDB.swift
    exactVersion: 7.11.1
targets:
  Hive:
    type: application
    platform: iOS
    sources:
      - App/Sources
      # The Icon Composer icon is declared separately below, so this entry must not
      # also walk into it.
      - path: App/Resources
        excludes:
          - hive-buzz-app.icon
          - hive-buzz-app.icon/**
      # `hive-buzz-app.icon` is a FILE WRAPPER, not a folder: `actool` compiles it
      # into the icon variants iOS 26 needs (light, dark, clear, tinted). XcodeGen
      # 2.44 does not know the `.icon` extension, so left to its own devices it
      # recurses in and adds `icon.json` and the layer images as four LOOSE
      # resources — which copies 330 KB of raw art into the bundle and leaves the
      # icon uncompiled. `type: file` keeps the wrapper whole; Xcode types it from
      # the extension and routes it to `actool`.
      - path: App/Resources/hive-buzz-app.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: NostrCore
      - package: BuzzKit
      - package: GRDB
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Hive
        # Answers App Store Connect's export-compliance question once, in the binary,
        # instead of by hand at every single upload.
        #
        # Recorded plainly because the answer is not self-evident from the code: this
        # app does implement encryption of its own. `NostrCore/NIP44.swift` is NIP-44 v2
        # authenticated encryption over `NostrCore/ChaCha20.swift` — raw ChaCha20
        # (RFC 8439), hand-rolled because CryptoKit ships only the AEAD variant — keyed
        # by HKDF-SHA256 and authenticated with HMAC-SHA256. It is live, not
        # aspirational: `SyncEngine+ChannelMutes`, `SyncEngine+ReadState` and
        # `SyncEngine+Reminders` all encrypt user state through it before it reaches a
        # relay.
        #
        # `false` is set here as a deliberate call by the app owner (2026-08-04) to
        # unblock TestFlight, having been shown the above. It asserts no *non-exempt*
        # encryption. Revisit before public release: this is a declaration to Apple and
        # to US export regulators, and whether this use qualifies for an exemption is a
        # compliance question rather than an engineering one.
        ITSAppUsesNonExemptEncryption: false
        # ProMotion. Without this key iOS clamps every animation in the app to 60 Hz on a
        # 120 Hz phone — the cap is opt-out, not opt-in, and it applies to Core Animation and
        # to SwiftUI's `TimelineView(.animation)` alike. The onboarding honeycomb is a
        # per-frame Metal shader (`Honeycomb.metal`) and is the reason this is here; every
        # other animation in the app gets the higher rate with it.
        CADisableMinimumFrameDurationOnPhone: true
        # A branded launch background (honey-tinted, light/dark) so the first frame is
        # not a bare white/black flash. The colour asset lives in the app's catalog.
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Hive is a dark app and has no light-mode design. This is the UIKit half of
        # that decision: it fixes the style of every window, of the surfaces UIKit
        # presents on our behalf (the share sheet, the photo picker, the keyboard,
        # system alerts) and of the launch screen — none of which a SwiftUI
        # `preferredColorScheme` reaches. The SwiftUI half is on the window group in
        # `HiveApp`. It belongs here rather than in `App/Info.plist`, which xcodegen
        # regenerates from this block: a key written straight into that file survives
        # until the next `make generate` and then silently disappears.
        UIUserInterfaceStyle: Dark
        # Hive is laid out for one hand in portrait and has no landscape design: the
        # sidebar overlays the conversation rather than sitting beside it, and the
        # composer's growth and keyboard handling are both measured against a portrait
        # safe area. Rotating produced a stretched version of a phone layout, not a
        # wider one, so the orientation is fixed rather than left to the default (which
        # is every orientation).
        #
        # Portrait alone is only a legal declaration for an iPhone-only app: claiming
        # iPad obliges the app to support iPad multitasking, which means offering all
        # four orientations, and App Store Connect rejects the upload otherwise
        # (ITMS-90474). That is why `TARGETED_DEVICE_FAMILY` below is pinned to `1`
        # rather than left at XcodeGen's `1,2`. The two keys have to be read together:
        # widening one without the other breaks delivery.
        #
        # Here and not in `App/Info.plist` for the reason given above: xcodegen
        # regenerates that file from this block, so a key written straight into it
        # survives until the next `make generate` and then silently disappears.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The mobile client's Inter body and GeistMono code families, both under SIL
        # Open Font License 1.1 — which requires its text to travel with the fonts, so
        # `Inter-LICENSE.txt` and `GeistMono-LICENSE.txt` ship beside them. Their
        # variable `wght` axis is resolved in `HiveTypography`, so no SwiftUI trait
        # modifier can silently flatten weight.
        UIAppFonts:
          - InterVariable.ttf
          - InterVariable-Italic.ttf
          - GeistMono-Variable.ttf
          - GeistMono-Italic-Variable.ttf
        # `buzz://join?relay=…&code=…` — how a relay's own invite page hands an
        # invitation to the installed app once its terms have been accepted in the
        # browser (`buzz/web/src/features/invite/ui/InvitePage.tsx:113`). The scheme
        # is shared with the desktop and Flutter clients by design: one link works on
        # whichever of them is installed. Without this declaration the page's "Accept
        # invite in Buzz" button does nothing on this phone.
        CFBundleURLTypes:
          - CFBundleURLName: xyz.buzz.join
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - buzz
        # The relay is owner-configured and may be a plaintext `ws://` endpoint on
        # a LAN or Tailscale address (the Pi in the slice's live run), which ATS
        # blocks by default. This is a self-hosted developer client, not an App
        # Store build; the exception is scoped to that reality and revisited when
        # TLS relays are the norm.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: >-
          Hive connects to the Buzz relay you configure, which may be on your local
          or Tailscale network.
        NSCameraUsageDescription: >-
          Hive uses the camera to take photos you attach to messages, and to scan the
          pairing QR code shown on your desktop.
        # Add-only, deliberately: Hive never reads the photo library, and the prompt a
        # reader is shown should promise no more than the app will do. The read-side
        # `NSPhotoLibraryUsageDescription` is absent for that reason — the composer's
        # picker runs out of process and needs no access at all.
        NSPhotoLibraryAddUsageDescription: >-
          Hive saves a picture from a conversation to your photo library when you
          ask it to.
    settings:
      base:
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        SWIFT_STRICT_CONCURRENCY: complete
        # iPhone only. Left unset, XcodeGen declares `1,2` — iPhone AND iPad — and
        # App Store Connect then rejects the upload, because an app that claims iPad
        # must support iPad multitasking, which means offering all four orientations
        # (ITMS-90474, build 32). This app offers portrait alone, on purpose and for
        # the reasons given at `UISupportedInterfaceOrientations` below.
        #
        # So the two claims were contradictory and one had to go. Dropping iPad is the
        # one that matches the app: there is no iPad design, as that same comment says,
        # so `1,2` promised a layout that was never drawn. The alternative — declaring
        # four orientations to satisfy the check — would ship a portrait phone layout
        # stretched across a landscape iPad, which is the thing the orientation lock
        # exists to prevent.
        #
        # This does not remove the app from iPad. An iPhone-only app still installs and
        # runs there, in a phone-shaped window, which is exactly what it is designed for.
        TARGETED_DEVICE_FAMILY: "1"
        # The app icon is `App/Resources/hive-buzz-app.icon` — the Icon Composer
        # document, named here WITHOUT its extension. It is the only app icon in the
        # project: there is deliberately no `AppIcon` set in the catalog to fall back
        # to, because a second one is how this setting came to name the wrong icon.
        # `AppIconTests` fails if the two ever drift apart again.
        ASSETCATALOG_COMPILER_APPICON_NAME: hive-buzz-app
        # The global accent — a honey amber that tints buttons, reaction chips and the
        # unread pill — lives in App/Resources/Assets.xcassets.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  HiveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - App/Tests
    dependencies:
      - target: Hive
      - package: BuzzKit
      - package: NostrCore
      - package: GRDB
      # `NostrCoreTestSupport` is deliberately NOT linked here. It is a static
      # product whose target depends on the NostrCore target, so linking it
      # embeds a second copy of NostrCore into this bundle beside the host
      # app's dynamic package framework — duplicate type metadata that breaks
      # dynamic casts (`catch … as RelayConnectionError` stops matching) and
      # with them the engine's whole rejection path. `FakeHTTPTransport` is
      # copied into App/Tests/Support instead (duplicate-the-harness
      # precedent).
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
  # The conversation scroll shapes. A UI-testing bundle, not a unit-test one: the
  # defects it exists for (a conversation that opens blank, a reader displaced when the
  # keyboard arrives) only appear against a real keyboard and a real scroll view, which
  # means an out-of-process driver. Kept out of the `Hive` scheme so the fast gate stays
  # fast — it has its own scheme and its own CI job, because the run is minutes not
  # seconds.
  HiveUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - App/UITests
    dependencies:
      - target: Hive
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
schemes:
  Hive:
    build:
      targets:
        Hive: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HiveTests
    # Named rather than left to the generator's default, because this is the
    # action Xcode Cloud performs to produce a TestFlight build and a scheme that
    # archived Debug would upload an unoptimised app with its test hooks in it.
    archive:
      config: Release
  # Runs the scroll shapes alone. `Hive` deliberately does not include them.
  ConversationUITests:
    build:
      targets:
        Hive: all
        HiveUITests: [test]
    test:
      config: Debug
      targets:
        - HiveUITests
